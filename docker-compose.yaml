networks:
  bp_network:
    driver: bridge

volumes:
  pg_data:

services:
  # PostgreSQL 18 (Epic 11, AD-16), the only data store. The volume mounts at /var/lib/postgresql
  # (the image's data root from 18 on), not the old .../data.
  postgres:
    image: postgres:18
    volumes:
      - pg_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:25432:5432" # loopback only — host-side dev access
    networks:
      - bp_network
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U bag_please_app -d bag_please" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Frontend: multi-stage image — Vite build served by Caddy, which also proxies
  # /api to bp_back. This is the production artifact the E2E suite runs against.
  bp_front:
    build:
      context: .
      dockerfile: bp_front/Dockerfile
    ports:
      - "127.0.0.1:2080:80"
    depends_on:
      postgres:
        condition: service_healthy
      bp_back:
        condition: service_started
    networks:
      - bp_network

  bp_back:
    build:
      context: .
      dockerfile: bp_back/Dockerfile
    ports:
      # Loopback only — the served entrypoint is bp_front (Caddy) on 127.0.0.1:2080;
      # 4000 is published solely so the local Vite dev server can proxy /api to it.
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bp_network
    environment:
      KTOR_DB_HOST: "postgres"
      KTOR_DB_PORT: "5432"
      KTOR_DB_NAME: "bag_please"
      KTOR_DB_USER: "bag_please_app"
      KTOR_DB_PASSWORD: "bag_please_app"
      # Local-only values: the backend has no fallback for these (production gets real ones from deploy).
      KTOR_JWT_SECRET: "local-dev-jwt-secret-not-for-production"
      KTOR_ADMIN_LOGIN: "admin"
      KTOR_ADMIN_PASS: "admin"

      KTOR_RATE_LIMIT_ATTEMPTS: 6000
