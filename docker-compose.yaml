networks:
  bp_network:
    driver: bridge

services:
  mongo:
    image: mongo:8
    volumes:
      - ./db/data:/data/db
    ports:
      - "27217:27017" # expose on host port 27217 to avoid conflict with local MongoDB
    networks:
      - bp_network
    environment:
      MONGO_INITDB_ROOT_USERNAME: "user"
      MONGO_INITDB_ROOT_PASSWORD: "pass"
      #kernel >= 6.19 workaround
      GLIBC_TUNABLES: "glibc:pthread:rseq=1"
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Frontend: multi-stage image — Vite build served by Caddy, which also proxies
  # /api to bp_back. This is the production artifact the E2E suite runs against.
  bp_front:
    build:
      context: .
      dockerfile: bp_front/Dockerfile
    ports:
      - "127.0.0.1:2080:80"
    depends_on:
      mongo:
        condition: service_healthy
      bp_back:
        condition: service_started
    networks:
      - bp_network

  bp_back:
    build:
      context: .
      dockerfile: bp_back/Dockerfile
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - bp_network
    environment:
      KTOR_MONGO_HOST: "mongo"
      KTOR_MONGO_PORT: "27017"
      KTOR_MONGO_DB_NAME: "bag_please"
      KTOR_MONGO_USER: "user"
      KTOR_MONGO_PASS: "pass"
      MIGRATION_TARGET_USER: "mia"

      KTOR_RATE_LIMIT_ATTEMPTS: 6000
