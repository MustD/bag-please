# Team overrides for bmad-dev-auto in bag-please.
#
# Base defaults live in {skill-root}/customize.toml, which is marked
# "DO NOT EDIT -- overwritten on every update"; this file is the sanctioned override point.
# Merge rules (_bmad/scripts/resolve_customization.py): scalars override, tables deep-merge,
# all other arrays append. So the entries below are ADDED to the base persistent_facts list,
# they do not replace the base "file:{project-root}/**/project-context.md" entry.
#
# Consumed by: .claude/skills/bmad-dev-auto/SKILL.md, "On Activation -> Step 3: Load Persistent Facts"
# ("All other entries are facts verbatim"), which runs before step-01 and therefore before
# step-02-plan.md instruction 6 decides whether to stamp `oversized`.

[workflow]

persistent_facts = [
  "SPEC SIZE BUDGET, bag-please (Story 7.15 verdict, 2026-08-21, measured not estimated). The stock budget in spec-template.md (900-1600 tokens) and the hardcoded 1600-token `oversized` trigger in step-02-plan.md instruction 6 are MIS-CALIBRATED for this repository and are superseded here. Measured planning-authored bodies of the six dev-auto specs written for this repo, o200k_base via tiktoken 0.14.0: 6.2 = 2726, 5.5 = 3085, 5.6 = 4468, 7.15 = 4530, 5.7 = 4832, 6.1 = 5959. Every one exceeded 1600 (1.70x to 3.72x) and every one was accepted as written, so the flag fired on 6 of 6 specs and carried no information. In this repo, stamp `oversized` only when the spec exceeds 6000 tokens. That number is the largest body observed here (6.1 = 5959, itself reported as an UPPER BOUND because review-loop additions could not be separated out) rounded up -- a 41-token / 0.7% margin, not an outlier-detection result; it is a population calibration chosen so the flag marks a genuine outlier rather than the norm, and it is not a validated boundary. Re-measure it once more than about ten specs exist in this repo, or if any spec lands within 10% of it. THE 900-TOKEN LOWER BOUND IS RETAINED unchanged -- only the upper trigger is recalibrated. This fact supersedes any conflicting spec-size guidance from the skill defaults or spec-template.md; note that persistent_facts arrays APPEND with no removal mechanism, so if a future skill update ships its own size fact, this one wins. Every bag-please spec must restate a large body of standing convention (project-context.md alone runs over 1000 lines), which is why the stock budget does not fit.",
  "SPEC SIZE MEASUREMENT, bag-please (Story 7.15). WHEN STAMPING AT PLAN TIME (step-02, the only moment the threshold is applied): the spec you have just written IS the planning-authored body -- spec-template.md emits no `## Implementation Record` and no `## Auto Run Result`, those are appended later by steps 03 and 04 -- so measure the whole file as written. WHEN MEASURING A COMPLETED SPEC RETROSPECTIVELY: cut at whichever comes first of `## Implementation Record` or `## Auto Run Result`, and drop the CONTENTS (not the headers) of `## Spec Change Log` and `## Review Triage Log`, because all of those are added after the warning was emitted; whole-file counts inflate the body non-uniformly (measured gap on the five historical specs: 1.32x to 1.65x; on this story's own spec, 2.03x). State the tokenizer by name and encoding when recording a count -- a token threshold with no named tokenizer cannot be complied with precisely by anyone, which is the defect that made the stock 1600 unusable. IF NO TOKENIZER IS AVAILABLE (there is no Claude tokenizer and no ANTHROPIC_API_KEY on this host), use chars/4 and say so: it tracked o200k_base within 4.3% across all six specs measured here. The reproducible instrument is committed at `_bmad-output/implementation-artifacts/tools/spec-token-count.py`.",
  "SPEC SIZE IS NOT A QUALITY PROXY, bag-please (Story 7.15). Across the five reviewed specs, spec size does not predict review-finding count: Spearman rho = 0.000 against total findings, -0.051 against actionable (patch+defer), -0.103 against medium-or-higher severity. The SMALLEST spec (6.2, 2726 tokens) produced the MOST findings (23) and five of the seven rows in the 'assertions that could not fail' table at epic-6-retro-2026-07-29.md:149-157 (that retro's own PROSE says '6 of the 17'; its table lists seven -- an inconsistency in the retro, not here). Do not trim a spec toward a token budget in the belief that it will reduce review findings; n=5, so this refutes the assumed direction rather than establishing the opposite one.",
  "MULTIPLE-GOALS IS NOT NOISE, bag-please (Story 7.15). The `multiple-goals` flag fired once, on Story 6.1, and was CORRECT: that story shipped the FR40 edit verb and the FR44 store write path, two independently shippable goals. bmad-dev-auto reported the risk in `bmad-dev-auto-result-epic-6.md` section 3 BEFORE Epic 6 ran and it was ignored. Unlike `oversized`, this flag is not recalibrated. When `multiple-goals` is carried forward, say so explicitly in the terminal result and name both goals, so the next reader cannot carry it unread.",
]

# Mechanism, not recall: the `multiple-goals` fact below asks the run to name both goals in its
# terminal result. `on_complete` is the HALT hook designed for exactly that, and a scalar override
# replaces the empty base value. Story 7.15 — the 6.1 warning was correct and was still carried unread.

on_complete = "If the spec's frontmatter `warnings` contains `multiple-goals`, the terminal result MUST name the independently shippable goals explicitly, one line each, so the flag cannot be carried unread. If it contains `oversized`, state the measured token count, the tokenizer used, and against which threshold."
