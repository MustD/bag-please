    status: done  # Delivered by Story 7.5 (2026-08-11) exactly as worded — byCreatedAtAsc = Date.parse(a.createdAt) - Date.parse(b.createdAt), in bp_front/src/lib/lists/homePath.ts. WITH ONE CORRECTION to the item's scope: it names only HomeRedirect, but there were TWO copies of the expression — ListShoppingPage.tsx:69 ordered the switcher chips with the same lexicographic sort, so `/` and the chip row could disagree. Both now call the shared comparator; grep -rn "createdAt.localeCompare" bp_front/src/ is zero. The alternative the item does not mention (backend fixed-precision timestamps) was explicitly rejected per AR-E7-7 — git diff bp_back/ is empty. Verified by a page.route interception patching only the two createdAt values to the precision pair the UI cannot produce, observed red on both chromium and mobile with the comparator reverted
