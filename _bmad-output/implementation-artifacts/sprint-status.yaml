ng index-D0HEEKre.js byte-for-byte (so the build is deterministic), docker cp-ed over the running Caddy container's /srv and VERIFIED SERVED (curl shows assets/index-D0HEEKre.js, and assets/index-dd3zm4T-.js again after restore, so the A/B was real); the same /auth page captured under both bundles at 1440x900 and 360x740 is MD5-IDENTICAL (00177dc4e2cf01d0fba0e9bd64a5da70 desktop, 615a522fc22db1a857ad4957f1f4b39e at 360px) and a computed-style probe over body/h4/p/button/input/.MuiPaper-root/.MuiTextField-root/.MuiButton-root (colour, background, font family/size/weight, line-height, letter-spacing, margin, padding, radius, shadow, bounding rect) DIFFS CLEAN at both widths. That comparator was falsified too: a one-token background change #121212 -> #111213 moves the screenshot md5 to bccb6817b611dacb787157a2e11acfd0. Hand pass on :2080 exercised a QUERY (list detail and shopping views render), MUTATIONS (create list, create category, add item, each round-tripping, with the inline 'Choose a category' validation still firing) and a LIVE SUBSCRIPTION (a check in one tab flips the checkbox in a second tab with no reload over /api/subscriptions); the only console error is the expected 401 from the silent refresh with no cookie. NOTHING WAS FORCED: no --legacy-peer-deps, no --force, no overrides, no resolutions, no .npmrc, not even transiently; no peer package moved (@apollo/client 4.2.11, graphql-ws 6.2.1, cli 7.2.0, client-preset 6.1.3 all unchanged) and the available @apollo/client 4.2.12 patch was DELIBERATELY NOT swept in (S-AC4, filed); no assertion edited, no ignores widened, no skipLibCheck, no @ts-expect-error, no disabled rule, no src/ or e2e/ change, no hand-edit of src/__generated__/. package.json keeps the project's exact-pin style ('graphql': '17.0.2', not the ^17.0.2 npm wrote). NOT ESTABLISHED, stated rather than glossed: that graphql-config is v17-safe on paths other than config-loading (only the codegen.ts load path was walked); that the +42 modules / +0.