  7-10-typescript-6-to-7: done  # 2026-08-15; DONE AS A HELD-BACK MAJOR UNDER S-AC3, NOT AS A LANDED BUMP — typescript stays pinned at 6.0.3 while 7.0.2 is latest, the failed bump was REVERTED and RECORDED rather than worked around, and a held-back dependency CLOSES its story rather than failing or blocking it. THE COMMIT CONTAINS NO bp_front/ PATH AT ALL (verified with git show --stat): the only files that moved are deferred-work.md, project-context.md, this file and the spec. ROUTED FROM A MEASUREMENT TAKEN IN THIS PASS, never from the spec's recalled numbers: npm view typescript dist-tags -> latest 7.0.2 (next 7.1.0-dev.20260815.1, a prerelease and never a candidate); typescript-eslint@latest 8.67.0 AND canary 8.67.1-alpha.4 both peer typescript ">=4.8.4 <6.1.0"; @typescript-eslint/parser@latest identical; and a sweep of ALL 83 published typescript-eslint >=8.0.0 releases shows the typescript peer takes exactly four values — <6.0.0 (31), <5.9.0 (21), <6.1.0 (19), <5.8.0 (12) — so NONE admits 7.x. There is no version to move to, not merely no stable one. THE BLOCKING SYMPTOM WAS REPRODUCED IN THE REAL bp_front/ TREE, NOT CITED FROM A PEER-RANGE STRING, and one thing came out DIFFERENT from what the spec predicted: npm install typescript@7.0.2 SUCCEEDED, exit 0 (added 13 / removed 12 / changed 1) — npm only emits "npm warn ERESOLVE overriding peer dependency ... peer typescript@\">=4.8.4 <6.1.0\" from typescript-eslint@8.67.0" for an explicitly-versioned target instead of failing. So --legacy-peer-deps was NEVER NEEDED and NEVER USED (no .npmrc exists; npm config get legacy-peer-deps -> false). The peer conflict does not stop you; the RUNTIME does. With 7.0.2 installed, npm run lint exits 2 having linted ZERO FILES, dying at MODULE LOAD: "Error: typescript-eslint does not support TS 7.0. at Object.<anonymous> (node_modules/typescript-eslint/dist/index.js:52:11)", pointing at github.com/typescript-eslint/typescript-eslint/issues/10940 which tracks support for TS >=7.1 — 7.0 will never be supported. That is the ENTIRE static lint gate, including the load-bearing react-hooks/set-state-in-effect rule. ROOT CAUSE measured in-tree: TS 7 is the native Go port and ships NO JavaScript compiler API — require('typescript') yields exactly ['version','versionMajorMinor'], ts.createProgram is undefined, and tsserver is GONE from bin/ (6.0.3 ships both), which is filed separately as an editor-tooling gap NO GATE HERE CAN SEE. THE FINDING WORTH KEEPING: THE CODEBASE IS ALREADY TS-7-CLEAN — with 7.0.2 actually installed and node_modules/.tmp cleared, npx tsc -b tsconfig.json --force exits 0 with ZERO DIAGNOSTICS, and each project alone (tsconfig.app.json / tsconfig.node.json / tsconfig.e2e.json --noEmit) exits 0, under unchanged strict/noUnusedLocals/noUnusedParameters/noFallthroughCasesInSwitch. No @ts-ignore, no @ts-expect-error, no weakened compiler option, no tsconfig touched. So the hold is about the LINTER, not the code, and the eventual bump is expected to be a ONE-LINE version change. The documented side-by-side/dual-TypeScript workaround (typescript: npm:@typescript/typescript6 alongside @typescript/native) is REFUSED on three recorded costs: S-AC3 forbids working around a failed bump, it would DOWNGRADE the linting compiler to 6.0.2 when this project is on 6.0.3, and it splits the codebase across two type systems. REVERT VERIFIED: git checkout -- package.json package-lock.json && npm ci && rm -rf node_modules/.tmp; git status --short shows nothing but the untracked spec, npx tsc --version -> Version 6.0.3, and package.json/package-lock.json contain zero occurrences of legacy-peer-deps, overrides, resolutions or @typescript/. The throwaway reproduction had moved 789 lockfile lines (576 insertions / 215 deletions — TS 7 brings 20 platform-optional @typescript/typescript-* packages); none of it survived. S-AC1 RE-RUN ON THE RESTORED TREE AND ALL GREEN, none quoted: npm run lint exit 0; rm -rf node_modules/.tmp && npm run build exit 0 (vite 8.2.1, 1255 modules, dist/assets/index-D0HEEKre.js 801.60 kB / 240.42 kB gzip); docker compose up -d --build exit 0; npm run test:e2e 120 passed (42.4s) exit 0 at retries:0, GREEN FIRST TRY at both ends of the pass — the known createUserViaUi defect did NOT fire once, so no re-run was needed. Split re-measured at both ends and unchanged: 59 chromium / 59 mobile / 1 registration-toggle-chromium / 1 registration-toggle-mobile = 120 tests in 10 files, i.e. the standing invariant of EXACTLY 1 test in each registration-toggle-* project holds. LEDGER: a new "## Deferred from: Story 7.10 — TypeScript 6 → 7 (2026-08-15)" section inserted at the documented point (before the 7-8-7-9 code-review section) carrying the version attempted, BOTH verbatim symptoms, the TS-7-clean finding, the rejected side-by-side option with its three costs and a concrete re-check trigger; the diff is 116 insertions / ZERO deletions in exactly two hunks and the three untouched regions were verified BYTE-IDENTICAL by md5. Story 7.7's typescript-eslint/TS-7 deadlock entry is marked RESOLVED and points here — its prediction was correct and the second of its two sanctioned outcomes was taken. STORY 7.11 IS **NOT** BLOCKED BY THIS HOLD, and the next run must not read it as a stalled chain: typescript-eslint 8.67.0 peers eslint "^8.57.0 || ^9.0.0 || ^10.0.0", so ESLint 9 -> 10 is admitted by the CURRENTLY INSTALLED bridge with no TypeScript movement required. The epic's "7.11 depends on 7.10" is satisfied by 7.10 CLOSING, not by it landing a bump. The combined-7.10+7.11-story contingency Story 7.7 proposed is therefore NOT needed. RE-CHECK TRIGGER for a future attempt: npm view typescript-eslint@latest peerDependencies.typescript returning an upper bound that admits 7.1 or later (7.0 can never qualify — it ships no API; 7.1 is slated to ship a new one), tracked at issue #10940, open on 2026-08-15 and labelled "blocked by external API".
