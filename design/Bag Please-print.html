<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>Bag Please — Print</title>
  <style>
      html, body {
          margin: 0;
          padding: 0;
          background: #f5f5f7;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
      }

      body {
          font-family: -apple-system, "SF Pro Text", "SF Pro", system-ui, sans-serif;
      }

      * {
          box-sizing: border-box;
      }

      .page {
          width: 100%;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: flex-start;
          padding: 40px 24px 32px;
          page-break-after: always;
          break-after: page;
      }

      .page:last-child {
          page-break-after: auto;
          break-after: auto;
      }

      .page-title {
          font-size: 14px;
          font-weight: 600;
          letter-spacing: 0.4px;
          text-transform: uppercase;
          color: #6b6b70;
          margin: 0 0 6px 0;
      }

      .page-subtitle {
          font-size: 12px;
          color: #8e8e93;
          margin: 0 0 18px 0;
      }

      .device-wrap {
          display: flex;
          justify-content: center;
      }

      @page {
          size: A4 portrait;
          margin: 12mm;
      }

      @media print {
          html, body {
              background: #fff;
          }

          .page {
              padding: 0;
              min-height: 0;
          }

          .device-wrap {
              transform-origin: top center;
          }
      }
  </style>
</head>
<body>
<div id="root"></div>

<script crossorigin="anonymous"
        integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
        src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin="anonymous"
        integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
        src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script crossorigin="anonymous"
        integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
        src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

<script src="data.js"></script>
<script src="theme.js"></script>

<script src="ios-frame.jsx" type="text/babel"></script>
<script src="tweaks-panel.jsx" type="text/babel"></script>
<script src="components.jsx" type="text/babel"></script>
<script src="screens.jsx" type="text/babel"></script>
<script src="sheets.jsx" type="text/babel"></script>

<script type="text/babel">
    // Print-friendly: render each screen on its own page inside a static iPhone frame.

    function FrozenFrame({children, theme = 'light'}) {
        const ref = React.useRef(null);
        React.useEffect(() => {
            if (ref.current) {
                window.BPTheme.applyToRoot(ref.current, {theme, accent: 'teal', density: 'cozy'});
            }
        }, [theme]);
        const dark = theme === 'dark';
        return (
            <div className="device-wrap">
                <IOSDevice dark={dark} width={402} height={874}>
                    <div ref={ref} style={{
                        position: 'absolute', inset: 0, overflow: 'hidden',
                        background: 'var(--bp-bg)', color: 'var(--bp-text)',
                        fontFamily: '-apple-system, "SF Pro Text", "SF Pro", system-ui, sans-serif',
                        WebkitFontSmoothing: 'antialiased',
                        display: 'flex', flexDirection: 'column',
                    }}>
                        <div style={{
                            position: 'absolute',
                            top: 0,
                            left: 0,
                            right: 0,
                            zIndex: 50,
                            pointerEvents: 'none'
                        }}>
                            <IOSStatusBar dark={dark}/>
                        </div>
                        <div style={{flex: 1, overflow: 'hidden', position: 'relative'}}>
                            {children}
                        </div>
                        <div style={{
                            position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
                            height: 22, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
                            paddingBottom: 6, pointerEvents: 'none',
                        }}>
                            <div style={{
                                width: 134, height: 5, borderRadius: 100,
                                background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.32)',
                            }}/>
                        </div>
                    </div>
                </IOSDevice>
            </div>
        );
    }

    function makeBase() {
        const seed = window.__BP_SEED;
        return {
            items: seed.items,
            categories: seed.categories,
            lists: seed.lists,
            members: seed.members,
            activeList: 'main',
            sheet: null,
        };
    }

    const noop = () => {
    };

    const tweaks = {theme: 'light', accent: 'teal', density: 'cozy', showStore: true, showRecurring: true};

    function PrintApp() {
        const baseToday = {...makeBase(), screen: 'today'};
        const baseLists = {...makeBase(), screen: 'lists'};
        const baseYou = {...makeBase(), screen: 'you'};
        const baseCats = {...makeBase(), screen: 'categories'};

        // For the "with editor sheet" page, we render a today screen + the sheet visibly open
        const baseTodayEdit = {
            ...makeBase(), screen: 'today',
            sheet: {kind: 'edit', id: 'i01'}, // editing Avocado
        };

        const pages = [
            {
                title: '01 — To-Buy List',
                subtitle: 'Main screen, swipe-right to check, list-switcher chips, category groups',
                state: baseToday,
                screen: <ScreenToday state={baseToday} dispatch={noop} t={tweaks}/>
            },
            {
                title: '02 — Item Editor',
                subtitle: 'Edit-item sheet with name, category, list, store, recurring cadence',
                state: baseTodayEdit,
                withSheet: 'edit'
            },
            {
                title: '03 — Lists',
                subtitle: 'Primary list + side trips, members per list, catalog access',
                state: baseLists,
                screen: <ScreenLists state={baseLists} dispatch={noop}/>
            },
            {
                title: '04 — Household',
                subtitle: 'Members, activity, invite by email/username',
                state: baseYou,
                screen: <ScreenHousehold state={baseYou} dispatch={noop}/>
            },
            {
                title: '05 — Categories',
                subtitle: 'Manage groups, drag handle, item counts',
                state: baseCats,
                screen: <ScreenCategories state={baseCats} dispatch={noop}/>
            },
            {
                title: '06 — Dark mode',
                subtitle: 'Calm dark palette — same layout, accent stays legible',
                state: baseToday,
                screen: <ScreenToday state={baseToday} dispatch={noop} t={tweaks}/>,
                theme: 'dark'
            },
            {
                title: '07 — Sepia',
                subtitle: 'Warm low-strain reading theme',
                state: baseToday,
                screen: <ScreenToday state={baseToday} dispatch={noop} t={tweaks}/>,
                theme: 'sepia'
            },
        ];

        return (
            <React.Fragment>
                {pages.map((p, i) => (
                    <div className="page" key={i}>
                        <div style={{width: 402, maxWidth: '100%'}}>
                            <div className="page-title">{p.title}</div>
                            <div className="page-subtitle">{p.subtitle}</div>
                        </div>
                        <FrozenFrame theme={p.theme || 'light'}>
                            {p.withSheet === 'edit' ? (
                                <React.Fragment>
                                    <ScreenToday state={p.state} dispatch={noop} t={tweaks}/>
                                    <BPTabBar active="today" onChange={noop}/>
                                    <SheetItemEditor state={p.state} dispatch={noop} t={tweaks}/>
                                </React.Fragment>
                            ) : (
                                <React.Fragment>
                                    {p.screen}
                                    <BPTabBar
                                        active={p.state.screen === 'lists' || p.state.screen === 'categories' ? 'lists' : p.state.screen === 'you' ? 'you' : 'today'}
                                        onChange={noop}
                                    />
                                </React.Fragment>
                            )}
                        </FrozenFrame>
                    </div>
                ))}
            </React.Fragment>
        );
    }

    requestAnimationFrame(() => {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PrintApp/>);

        // Auto-print once fonts + render settle.
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => {
                setTimeout(() => {
                    try {
                        window.print();
                    } catch (e) {
                    }
                }, 800);
            });
        } else {
            setTimeout(() => {
                try {
                    window.print();
                } catch (e) {
                }
            }, 1200);
        }
    });
</script>
</body>
</html>
