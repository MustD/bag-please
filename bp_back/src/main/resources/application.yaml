ktor:
  development: false
  application:
    modules:
      - com.bagplease.ApplicationKt.module
  deployment:
    host: "0.0.0.0"
    port: 4000
    rootPath: "api"

jwt:
  secret: "$KTOR_JWT_SECRET:secret"
  issuer: "bag-please.com"
  audience: "bag-please.com"
  realm: "bag-please.com"
  admin_login: "$KTOR_ADMIN_LOGIN:admin"
  admin_pass: "$KTOR_ADMIN_PASS:admin"
  accessExpiryMinutes: "$KTOR_JWT_ACCESS_EXPIRY_MINUTES:15"
  refreshExpiryDays: "$KTOR_JWT_REFRESH_EXPIRY_DAYS:30"

rateLimit:
  attempts: "$KTOR_RATE_LIMIT_ATTEMPTS:5"
  windowSeconds: "$KTOR_RATE_LIMIT_WINDOW_SECONDS:60"

db:
  postgres:
    host: "$KTOR_DB_HOST:localhost"
    port: "$KTOR_DB_PORT:25432"
    name: "$KTOR_DB_NAME:bag_please"
    user: "$KTOR_DB_USER:bag_please_app"
    password: "$KTOR_DB_PASSWORD:bag_please_app"
    sslmode: "$KTOR_DB_SSLMODE:disable"
    sslrootcert: "$KTOR_DB_SSLROOTCERT:"
    poolMaxSize: "$KTOR_DB_POOL_MAX_SIZE:5"
