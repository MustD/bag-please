# mise tasks for Bag Please — run `mise tasks` to list, `mise run <task>` to execute.
# Tool versions match the project (backend jvmToolchain(25), Next 16 frontend).

[tools]
java = "temurin-25"
node = "26"

# --- Backend (Kotlin/Ktor, Gradle multi-project, port 4000) ---

[tasks."back:build"]
description = "Build the backend"
run = "./gradlew :bp_back:build"

[tasks."back:run"]
description = "Run the backend in dev mode (continuous build)"
run = "./gradlew :bp_back:run -t"

[tasks."back:test"]
description = "Run all backend tests"
run = "./gradlew :bp_back:test"

# --- Frontend (Next.js 16 / React 19, port 3000) ---

[tasks."front:install"]
description = "Install frontend dependencies"
dir = "bp_front"
run = "npm install"

[tasks."front:dev"]
description = "Start the Next.js dev server on :3000"
dir = "bp_front"
run = "npm run dev"

[tasks."front:build"]
description = "Build the frontend"
dir = "bp_front"
run = "npm run build"

[tasks."front:lint"]
description = "Lint the frontend"
dir = "bp_front"
run = "npm run lint"

[tasks."front:generate"]
description = "Regenerate GraphQL types (needs backend on :2080/api/graphql)"
dir = "bp_front"
run = "npm run generate"

[tasks."front:e2e"]
description = "Run Playwright E2E tests"
dir = "bp_front"
run = "npm run test:e2e"

# --- Docker Compose (router + mongo + front + back on :2080) ---

[tasks."up"]
description = "Start everything (router + mongo + front + back)"
run = "docker compose up --build"

[tasks."infra"]
description = "Start only infrastructure (mongo + router) for local dev"
run = "docker compose up mongo router"

# -- Ai infra ---

[tasks."skill-validate"]
description = "Tessl skill validation"
run = "npx tessl skill review $@"

# --- Update / maintenance ---

[tasks."update:bmad"]
description = "Update BMad Method (core + modules) by re-running the installer"
run = "npx bmad-method install"

[tasks."update:front"]
description = "Update frontend npm dependencies"
dir = "bp_front"
depends = ["update:bmad"]
run = "npm update"

[tasks."update"]
description = "Update everything — BMad first, then frontend deps"
depends = ["update:bmad", "update:front"]
