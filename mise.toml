# mise tasks for Bag Please — run `mise tasks` to list, `mise run <task>` to execute.
# Tool versions match the project (backend jvmToolchain(25), Vite + React 19 frontend).

[tools]
java = "temurin-25"
node = "26.4"

# --- Backend (Kotlin/Ktor, Gradle multi-project, port 4000) ---

[tasks."back:build"]
description = "Build the backend"
run = "./gradlew :bp_back:build --console=plain"

[tasks."back:run"]
description = "Run the backend in dev mode (continuous build)"
run = "./gradlew :bp_back:run -t --console=plain"

[tasks."back:test"]
description = "Run all backend tests"
run = "./gradlew :bp_back:test --console=plain"

# --- Frontend (Vite + React 19 SPA, dev server on :5173) ---

[tasks."front:install"]
description = "Install frontend dependencies"
dir = "bp_front"
run = "npm install"

[tasks."front:dev"]
description = "Start the Vite dev server on :5173 (proxies /api to :4000)"
dir = "bp_front"
run = "npm run dev"

[tasks."front:build"]
description = "Build the frontend"
dir = "bp_front"
run = "npm run build"

[tasks."front:lint"]
description = "Lint the frontend"
dir = "bp_front"
run = "npm run lint"

[tasks."front:generate"]
description = "Regenerate GraphQL types (needs backend on :2080/api/graphql)"
dir = "bp_front"
run = "npm run generate"

[tasks."front:e2e"]
description = "Run Playwright E2E tests"
dir = "bp_front"
run = "npm run test:e2e"

# --- Docker Compose (Caddy frontend + mongo + back; entry point :2080) ---

[tasks."up"]
description = "Build & start everything (frontend[Caddy] + mongo + back) on :2080"
run = "docker compose up --build"

[tasks."infra"]
description = "Start only mongo + backend so the Vite dev server (front:dev) can proxy to :4000"
run = "docker compose up mongo bp_back"

# -- Ai infra ---

[tasks."skill-validate"]
description = "Tessl skill validation"
run = "npx tessl skill review $@"

# --- Update / maintenance ---

[tasks."update:bmad"]
description = "Update BMad Method (core + modules) by re-running the installer"
run = "npx bmad-method install"

[tasks."update:front"]
description = "List available frontend npm dependency updates (does not modify files)"
dir = "bp_front"
run = "npx npm-check-updates --format group"

[tasks."gradle:dependencyUpdates"]
description = "List available Gradle dependency updates (does not modify files)"
run = "./gradlew dependencyUpdates --console=plain"
