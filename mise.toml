# mise tasks for Bag Please — run `mise tasks` to list, `mise run <task>` to execute.
# Tool versions match the project (backend jvmToolchain(25), Vite + React 19 frontend).

[tools]
gradle = "9"
java = "temurin-25"
node = "26"

# Regenerates .zed/tasks.json from the tasks above so Zed's task picker
# mirrors mise. Hidden so it doesn't list itself; rerun after editing tasks.
[tasks."zed:sync"]
description = "Regenerate .zed/tasks.json from the mise tasks"
hide = true
run = '''
{
  echo '// GENERATED by `mise run zed:sync` from ../mise.toml; do not edit by hand.'
  mise tasks ls --json | jq '[.[] | select(.hide | not) | {
    label: (.name + (if .description != "" then " — " + .description else "" end)),
    command: "mise",
    args: ["run", .name],
    reveal: "always",
    use_new_terminal: false,
    allow_concurrent_runs: false
  }]'
} > '{{config_root}}/.zed/tasks.json'
'''

# --- Backend (Kotlin/Ktor, Gradle multi-project, port 4000) ---

[tasks."back:build"]
description = "Build the backend without tests"
run = "gradle :bp_back:build -xtest"

[tasks."back:run"]
description = "Run the backend in dev mode (continuous build)"
run = "gradle :bp_back:run -t"

[tasks."back:test"]
description = "Run all backend tests (one line per test + a pass/fail summary)"
run = "./mise/back_test.sh"

# --- Frontend (Vite + React 19 SPA, dev server on :5173) ---

[tasks."front:install"]
description = "Install frontend dependencies"
dir = "bp_front"
run = "npm install"

[tasks."front:dev"]
description = "Start the Vite dev server on :5173 (proxies /api to :4000)"
dir = "bp_front"
run = "npm run dev"

[tasks."front:build"]
description = "Build the frontend"
dir = "bp_front"
run = "npm run build"

[tasks."front:lint"]
description = "Lint the frontend"
dir = "bp_front"
run = "npm run lint"

[tasks."front:generate"]
description = "Regenerate GraphQL types (needs backend on :2080/api/graphql)"
dir = "bp_front"
run = "npm run generate"

[tasks."front:e2e"]
description = "Run Playwright E2E tests"
dir = "bp_front"
run = "npm run test:e2e"

# --- Docker Compose (Caddy frontend + postgres + back; entry point :2080) ---

[tasks."docker:up"]
description = "Build & start everything (frontend[Caddy] + postgres + back) on :2080"
run = "docker compose up --build"

[tasks."docker:down"]
description = "Stop everything (frontend[Caddy] + postgres + back) on :2080"
run = "docker compose down"

[tasks."docker:back"]
description = "Start only postgres + backend so the Vite dev server (front:dev) can proxy to :4000"
run = "docker compose up postgres bp_back"

[tasks."db:import:local"]
description = "Import a Mongo export (default migration-export/) into the local Compose PostgreSQL (must be empty)"
run = "./mise/db_import.sh"

# --- Production infrastructure (deploy/README.md). Each task loads .secure.deploy.env itself; nothing global. ---

[tasks."infra:plan"]
description = "Terraform plan for the DigitalOcean droplet + this app's database on the shared PostgreSQL (needs .secure.deploy.env)"
env = { _ = { file = ".secure.deploy.env" } }
run = "deploy/scripts/infra.sh plan"

[tasks."infra:apply"]
description = "Terraform apply for the DigitalOcean droplet + this app's database on the shared PostgreSQL (by hand, never from CI)"
env = { _ = { file = ".secure.deploy.env" } }
run = "deploy/scripts/infra.sh apply"

[tasks."db:bootstrap"]
description = "One-time: grant bag_please_app the shared cluster's bag_please database and run Flyway (needs psql, hub checkout)"
env = { _ = { file = ".secure.deploy.env" } }
run = "deploy/scripts/bootstrap-db.sh"

[tasks."db:import"]
description = "Import a Mongo export (default migration-export/) into the production PostgreSQL"
env = { _ = { file = ".secure.deploy.env" } }
run = "deploy/scripts/import.sh"

[tasks."deploy:test"]
description = "Run the deploy script guard tests (stubbed terraform/ssh/git; no network)"
run = "deploy/scripts/test-guards.sh"

[tasks."images:build-push"]
description = "Build & push backend/frontend images tagged with the current version (needs project.env + docker login)"
run = "./mise/images-build-push.sh"

# --- Update / maintenance ---
[tasks."update:mise-tools"]
description = "Update Mise tools"
run = "mise upgrade"

[tasks."update:bmad"]
description = "Update BMad Method (core + modules) by re-running the installer"
run = "npx bmad-method install"

[tasks."update:front-ls"]
description = "List available frontend npm dependency updates (does not modify files)"
dir = "bp_front"
run = "npx npm-check-updates --format group"

[tasks."update:back-ls"]
description = "List available Gradle dependency updates (does not modify files)"
run = "gradle dependencyUpdates"
